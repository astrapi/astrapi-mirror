modal_width: 500

fields:
  - type:  section
    label: Download
    cols:  3

  - key:         max_parallel_downloads
    label:       Parallele Downloads
    type:        text
    placeholder: "4"
    default:     "4"
    description: "Anzahl gleichzeitiger Downloads pro Repo"

  - key:         limit_rate
    label:       Bandbreitenlimit
    type:        text
    placeholder: "200m"
    default:     ""
    description: "z.B. 200m, 500k, 1g — Leer = kein Limit"

  - key:         file_timeout
    label:       Timeout pro Datei (s)
    type:        text
    placeholder: "1800"
    default:     "1800"
    description: "Sekunden bis ein einzelner Download-Versuch abbricht (pro Mirror, nicht gesamt) — 0 = kein Limit. Bei mehreren GB großen Paketen (cuda, rocm, dotnet-*) reichen 300s selbst bei gesunder Verbindung oft nicht."

  - key:         exclude_patterns
    label:       Ausschluss-Muster
    type:        textarea
    span:        3
    rows:        3
    placeholder: "cuda*\n*rocm*\nhipblaslt*\ncomposable-kernel*\nintel-oneapi-toolkit*\ndotnet-source-built-artifacts*"
    default:     "cuda*\n*rocm*\nhipblaslt*\ncomposable-kernel*\nintel-oneapi-toolkit*\ndotnet-source-built-artifacts*"
    description: "Ein Glob-Muster pro Zeile (fnmatch), Pakete mit passendem Dateinamen werden nicht heruntergeladen (bereits lokal vorhandene werden beim nächsten Sync als veraltet entfernt). Für notorisch riesige, seltene Pakete wie CUDA/ROCm/.NET-SDK-Artefakte, die auf vielen Mirrors ohnehin nicht zuverlässig verfügbar sind."

  - type:  section
    label: Optionen
    cols:  1

  - key:         validate_signatures
    label:       Signaturen prüfen
    type:        boolean
    default:     "true"
    description: "Pacman-Signaturen validieren nach dem Sync (pacman-key workflow)"
