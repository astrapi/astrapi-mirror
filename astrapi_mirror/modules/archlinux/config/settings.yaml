modal_width: 500

fields:
  - type:  section
    label: Download
    cols:  3

  - key:         max_parallel_downloads
    label:       Parallele Downloads
    type:        text
    placeholder: "4"
    default:     "4"
    description: "Anzahl gleichzeitiger Downloads pro Repo"

  - key:         limit_rate
    label:       Bandbreitenlimit
    type:        text
    placeholder: "200m"
    default:     ""
    description: "z.B. 200m, 500k, 1g — Leer = kein Limit"

  - key:         file_timeout
    label:       Timeout pro Datei (s)
    type:        text
    placeholder: "300"
    default:     "300"
    description: "Sekunden bis ein einzelner Download abbricht — 0 = kein Limit"

  - type:  section
    label: Optionen
    cols:  1

  - key:         validate_signatures
    label:       Signaturen prüfen
    type:        boolean
    default:     "true"
    description: "Pacman-Signaturen validieren nach dem Sync (pacman-key workflow)"
