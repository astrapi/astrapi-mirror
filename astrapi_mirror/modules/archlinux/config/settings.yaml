modal_width: 500

fields:
  - type:  section
    label: Download
    cols:  1

  - key:         max_parallel_downloads
    label:       Parallele Downloads (pro Repo)
    type:        text
    placeholder: "4"
    default:     "4"
    description: "Anzahl gleichzeitig laufender Download-Tasks (asyncio Semaphore)"

  - key:         limit_rate
    label:       Bandbreitenlimit (pro Download-Task)
    type:        text
    placeholder: "200m"
    default:     ""
    description: "z.B. 200m = 200 MB/s, 500k = 500 KB/s (wget-Syntax: k/m/g). Leer = kein Limit."

  - type:  section
    label: Optionen
    cols:  1

  - key:         validate_signatures
    label:       Signaturen prüfen
    type:        boolean
    default:     "true"
    description: "Pacman-Signaturen validieren nach dem Sync (pacman-key workflow)"
