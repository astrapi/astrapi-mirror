fields:
  - name:        label
    label:       Bezeichnung
    type:        text
    placeholder: "Debian Bookworm Official"
    max:         120
    column:      1
    row:         1
    colspan:     2

  - name:        url
    label:       Primäre URL
    type:        text
    placeholder: "https://deb.debian.org/debian"
    max:         500
    column:      1
    row:         2
    colspan:     2

  - name:        mirror_urls
    label:       Weitere Quellen / Fallback (eine URL pro Eintrag)
    type:        list
    placeholder: "http://deb.debian.org/debian"
    column:      1
    row:         3
    colspan:     2
    description: "Optionale Fallbacks bei Netzwerkfehler."

  - name:        suites
    label:       Suites / Distributionen
    type:        list
    placeholder: "bookworm, bookworm-updates, bookworm-backports …"
    max:         500
    column:      1
    row:         4

  - name:        components
    label:       Komponenten
    type:        list
    placeholder: "main, contrib, non-free, non-free-firmware …"
    max:         500
    column:      2
    row:         4

  - name:        architectures
    label:       Architekturen
    type:        list
    placeholder: "amd64, arm64, all …"
    max:         200
    column:      1
    row:         5

  - name:        repo_type
    label:       Typ
    type:        select
    default:     deb
    column:      2
    row:         5
    options:
      - value: deb
        label: "deb (Binär)"
      - value: deb-src
        label: "deb-src (Quellcode)"

  - name:        package_include
    label:       Paket-Filter (Include, ein fnmatch-Muster pro Zeile)
    type:        list
    placeholder: "grafana, grafana_*, foo-bar …"
    max:         2000
    column:      1
    row:         6
    colspan:     2
    description: "Leer = alle Pakete spiegeln. Gesetzt = nur Pakete, deren Dateiname
      auf mindestens ein Muster passt, werden heruntergeladen (z.B. bei Repos mit
      vielen unbenötigten Zusatzpaketen)."

  - name:        gpg_key_url
    label:       GPG-Schlüssel URL
    type:        text
    placeholder: "https://example.com/linux/debian/gpg"
    max:         500
    column:      1
    row:         7
    colspan:     2
