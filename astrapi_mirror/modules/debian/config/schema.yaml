fields:
  - name:        label
    label:       Bezeichnung
    type:        text
    placeholder: "Debian Bookworm Official"
    max:         120
    column:      1
    row:         1
    colspan:     2

  - name:        mirror_urls
    label:       Quellen (eine vollständige URL pro Eintrag)
    type:        list
    placeholder: "https://deb.debian.org/debian"
    column:      1
    row:         2
    colspan:     2
    description: "Erste URL = primärer Mirror; weitere = Fallbacks bei Netzwerkfehler."

  - name:        suites
    label:       Suites / Distributionen
    type:        list
    placeholder: "bookworm, bookworm-updates, bookworm-backports …"
    max:         500
    column:      1
    row:         3

  - name:        components
    label:       Komponenten
    type:        list
    placeholder: "main, contrib, non-free, non-free-firmware …"
    max:         500
    column:      2
    row:         3

  - name:        architectures
    label:       Architekturen
    type:        list
    placeholder: "amd64, arm64, all …"
    max:         200
    column:      1
    row:         4

  - name:        repo_type
    label:       Typ
    type:        select
    default:     deb
    column:      2
    row:         4
    options:
      - value: deb
        label: "deb (Binär)"
      - value: deb-src
        label: "deb-src (Quellcode)"

  - name:        package_include
    label:       Paket-Filter (Include, ein fnmatch-Muster pro Zeile)
    type:        list
    placeholder: "grafana, grafana_*, foo-bar …"
    max:         2000
    column:      1
    row:         5
    colspan:     2
    description: "Leer = alle Pakete spiegeln. Gesetzt = nur Pakete, deren Dateiname
      auf mindestens ein Muster passt, werden heruntergeladen (z.B. bei Repos mit
      vielen unbenötigten Zusatzpaketen)."

  - name:        keep_versions
    label:       Versionen pro Paket behalten
    type:        number
    default:     0
    column:      1
    row:         6
    description: "0 = alle Versionen (Standard). Bei > 0 werden pro Paket nur
      die N neuesten Versionen gespiegelt (echter Debian-Versionsvergleich,
      nicht Text-Sortierung) -- nuetzlich bei Repos, die alte Versionen nie
      entfernen."

  - name:        gpg_key_url
    label:       GPG-Schlüssel URL
    type:        text
    placeholder: "https://example.com/linux/debian/gpg"
    max:         500
    column:      1
    row:         7
    colspan:     2
