modal_width: 560

fields:
  - type:  section
    label: Download
    cols:  2

  - key:         threads
    label:       Parallele Downloads
    type:        text
    placeholder: "4"
    default:     "4"
    description: "Anzahl gleichzeitiger Downloads pro Repo"

  - key:         limit_rate
    label:       Bandbreitenlimit
    type:        text
    placeholder: "200m"
    default:     ""
    description: "z.B. 200m, 500k, 1g — Leer = kein Limit"

  - key:         file_timeout
    label:       Timeout pro Datei (s)
    type:        text
    placeholder: "300"
    default:     "300"
    description: "Sekunden bis ein einzelner Download abbricht — 0 = kein Limit"

  - type:  section
    label: Optionen
    cols:  2

  - key:         language
    label:       Sprache(n) für Translation-Dateien
    type:        text
    placeholder: "de_DE, en"
    default:     "de_DE, en"
    description: "Kommagetrennt; steuert welche Translation-Dateien geladen werden"

  - key:         contents
    label:       Contents-Dateien laden
    type:        boolean
    default:     "true"
    description: "Contents-[arch].* Dateien herunterladen"

  - key:         no_check_cert
    label:       SSL-Zertifikat nicht prüfen
    type:        boolean
    default:     "false"
    description: "wget --no-check-certificate (nur für selbstsignierte Repos)"
