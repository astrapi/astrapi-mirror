version:      26.4.1
name:         astrapi-mirror
display_name: Mirror

# folder-arrow-left-right-outline (mdiFolderArrowLeftRightOutline) --
# Repo-Inhalte wandern zwischen Quelle und Spiegel, fuer Favicon +
# PWA-Manifest (astrapi-core >= 26.9.3).
icon_svg: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M13 19C13 19.34 13.04 19.67 13.09 20H4C2.9 20 2 19.11 2 18V6C2 4.89 2.89 4 4 4H10L12 6H20C21.1 6 22 6.89 22 8V13.81C21.39 13.46 20.72 13.22 20 13.09V8H4V18H13.09C13.04 18.33 13 18.66 13 19M23 17L20 14.5V16H16V18H20V19.5L23 17M18 18.5L15 21L18 23.5V22H22V20H18V18.5Z'/></svg>"

# Login-Pflicht fuer die UI (bisher offen im LAN) + Mehrbenutzer-Login,
# Nutzerentscheidung 2026-09-13 -- geteilte Daten fuer alle eingeloggten
# Nutzer, keine Mandantentrennung. Erster Besucher landet auf
# /auth/register, wird automatisch Admin. exempt_prefixes zwingend
# noetig: /archlinux und /debian bedienen echte Paket-Downloads fuer
# pacman/apt auf Client-Maschinen im Fleet (api/repo.py::_OS_REGISTRY),
# keine Browser-Session -- ohne Ausnahme wuerde jeder Client-Zugriff auf
# /auth/login umgeleitet und das Paketmanagement im ganzen Fleet brechen.
auth:
  enabled: true
  multi_user: true
  rp_id: mirror.simpsons.lan
  rp_name: astrapi-mirror
  password_fallback: true
  exempt_prefixes:
    - /archlinux
    - /debian
  # GET-only, exakter Pfad (nicht Praefix!): astrapi-admin fragt hier die
  # Repo-Liste ab (mirror_client.py::list_debian_repos(), E-005), um sie
  # als Mirror-Quellen-Auswahl je Host anzubieten -- ohne Login-Session,
  # reiner Server-zu-Server-Aufruf. /api/debian traegt unter demselben
  # Pfad auch POST (Repo anlegen) -- ein Praefix-Exempt wie oben wuerde
  # das versehentlich mit freigeben, siehe [[T-332-MIRROR]].
  exempt_get_paths:
    - /api/debian
    - /api/archlinux

# Geteilte Daten (s.o.) -- eine gemeinsame Kategorienliste statt einer
# privaten pro Nutzer, siehe astrapi_core/system/categories_scope.py.
categories:
  scope: shared
