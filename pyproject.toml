[project]
name = "astrapi-mirror"
dynamic = ["version"]
description = "Mirror Control – Web-UI für Debian-Repository-Spiegel"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.1",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "APScheduler==3.11.2",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
    "cryptography==49.0.0",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "psutil==7.2.2",
    "astrapi-core>=26.8.13",
]

[project.scripts]
astrapi-mirror = "astrapi_mirror._cli:main"

[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["astrapi_mirror*"]

[tool.setuptools.package-data]
astrapi_mirror = [
    "app.yaml",
    "navigation.yaml",
    "modules/*/templates/**/*.html",
    "modules/*/schema.yaml",
    "modules/*/modul.yaml",
    "modules/*/settings.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]   # pycodestyle, pyflakes, isort, warnings
ignore = ["E501"]                # Zeilenlänge wird vom Formatter gesteuert

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
